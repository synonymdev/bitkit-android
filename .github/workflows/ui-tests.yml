name: Android Instrumented Tests

on:
  push:
    branches: [ "master" ]

  workflow_dispatch:
    inputs:
      suites:
        description: "integration (non-Compose), all, or comma-separated annotation names"
        required: false
        default: "integration"
        type: string

  workflow_call:
    inputs:
      suites:
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-instrumented-${{ inputs.suites || 'integration' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The integration tests fund and mine on the local regtest stack started below; an E2E build
    # points the wallet's electrum at it (Env.electrumUrlForNetwork). The ComposeUi suite needs neither.
    env:
      NEEDS_REGTEST: ${{ (inputs.suites || 'integration') != 'ComposeUi' }}
      E2E: ${{ (inputs.suites || 'integration') != 'ComposeUi' }}
      E2E_BACKEND: local

    steps:
      # bitcoind RPC (43782) and electrs (60001) sit in Linux's ephemeral range, so an outbound
      # connection made before `docker compose up` can take one and fail the bind.
      - name: Reserve regtest host ports
        if: env.NEEDS_REGTEST == 'true'
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=39388,43782,60001

      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Checkout bitkit-docker
        if: env.NEEDS_REGTEST == 'true'
        uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-docker
          ref: main
          path: bitkit-docker

      - name: Start local regtest
        if: env.NEEDS_REGTEST == 'true'
        working-directory: bitkit-docker
        timeout-minutes: 10
        run: |
          docker compose up -d bitcoind bitcoinsetup electrs
          until docker exec bitcoin bitcoin-cli -regtest -rpcport=43782 -rpcuser=polaruser -rpcpassword=polarpass -generate 101; do sleep 2; done
          until python3 -c 'import socket; s = socket.create_connection(("127.0.0.1", 60001), 10); s.sendall(b"{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"blockchain.headers.subscribe\",\"params\":[]}\n"); assert b"height" in s.recv(4096)'; do sleep 5; done

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Decode google-services.json
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            echo "GOOGLE_SERVICES_JSON_BASE64 is empty; using checked-in placeholder."
            exit 0
          fi
          mkdir -p app/src/debug
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/src/debug/google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug app
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHATWOOT_API: ${{ secrets.CHATWOOT_API }}
        run: |
          ./gradlew assembleDevDebug assembleDevDebugAndroidTest
          ls -la app/build/outputs/apk/dev/debug/
          ls -la app/build/outputs/apk/androidTest/dev/debug/

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-default-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run UI tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_TEST_SUITES: ${{ inputs.suites || 'integration' }}
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/run-ui-tests.sh

      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android_test_report_${{ inputs.suites || 'integration' }}
          path: |
            app/build/reports/androidTests/connected/**/*
            app/build/outputs/androidTest-results/connected/**/*
          if-no-files-found: warn
