name: E2E Skip

on:
  pull_request:
    paths-ignore:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/e2e.yml'

jobs:
  e2e-status:
    if: github.event.pull_request.draft == false
    name: e2e-status
    runs-on: ubuntu-latest
    steps:
      - run: echo "E2E skipped - no code changes"
