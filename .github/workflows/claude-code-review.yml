name: Claude Code Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number
      force_review:
        description: "Review again even if Claude previously commented"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Minimize old Claude comments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          PR_NUMBER="${{ inputs.pr_number }}"

          # Minimize issue comments from claude[bot]
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --jq '.[] | select(.user.login == "claude[bot]") | .node_id' | while read -r node_id; do
            if [ -n "$node_id" ]; then
              echo "Minimizing comment: $node_id"
              gh api graphql -f query='
                mutation($id: ID!) {
                  minimizeComment(input: {subjectId: $id, classifier: OUTDATED}) {
                    minimizedComment { isMinimized }
                  }
                }' -f id="$node_id" || true
            fi
          done

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: >-
            ${{ inputs.force_review && format('Perform a fresh code review of {0}/pull/{1}. Use gh pr view to capture the latest full head SHA, read the complete PR diff, relevant CLAUDE.md instructions and surrounding callers, and validate concrete actionable defects. Prior Claude comments concern earlier reviews; do not invoke the code-review plugin eligibility gate or skip this explicit fresh review. This is review only: do not edit files, commit, push, merge, or change PR state. Check the PR head again before posting one gh pr comment containing the exact reviewed full SHA and either actionable findings with file and line references or an explicit no-issues verdict. If the head changed, state the mismatch rather than declaring the new head clear.', github.repository, inputs.pr_number) || format('/code-review:code-review --comment {0}/pull/{1}', github.repository, inputs.pr_number) }}
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git diff:*),Bash(git blame:*),Read,Glob,Grep"
