name: Local E2E Nightly (Android)

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:
    inputs:
      e2e_branch:
        description: "Ref in synonymdev/bitkit-e2e-tests"
        type: string
        default: main
      post_to_slack:
        description: "Post Local E2E Nightly summary to Slack (#bitkit-staging-nightly)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

env:
  TERM: xterm-256color
  FORCE_COLOR: 1

concurrency:
  group: bitkit-local-e2e-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-spark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      spark-case: >-
        ${{ contains(steps.*.outputs.spark-case, 'passed') && 'passed' ||
            contains(steps.*.outputs.spark-case, 'failed') && 'failed' ||
            contains(steps.*.outputs.spark-case, 'started') && 'started' ||
            contains(steps.*.outputs.spark-case, 'setup') && 'setup' || '' }}
      spark-fixture: ${{ steps.spark.outcome }}
      e2e-sha: ${{ steps.e2e-source.outputs.commit }}
      app-build: ${{ steps.app-build.outcome }}
    env:
      COMPOSE_PROJECT_NAME: bitkit-spark-e2e
    steps:
      - name: Reserve regtest host ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=39388,43782,60001

      - uses: actions/checkout@v7
        with:
          path: bitkit-android
          persist-credentials: false

      - uses: actions/checkout@v7
        id: e2e-source
        with:
          repository: synonymdev/bitkit-e2e-tests
          ref: ${{ inputs.e2e_branch || 'main' }}
          path: bitkit-e2e-tests
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bitkit-e2e-tests/package-lock.json

      - name: Install Appium dependencies
        working-directory: bitkit-e2e-tests
        run: npm ci

      - name: Cache pinned Spark images
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/bitkit-spark-images.tar
          key: spark-images-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bitkit-e2e-tests/BITKIT_DOCKER_REVISION') }}

      - name: Start pinned Spark fixture
        id: spark
        working-directory: bitkit-e2e-tests
        env:
          SPARK_IMAGE_CACHE: ${{ runner.temp }}/bitkit-spark-images.tar
        run: |
          ./scripts/local-backend spark-up
          ./scripts/local-backend spark-env >> "$GITHUB_ENV"

      - name: Build Android Spark app
        id: app-build
        working-directory: bitkit-e2e-tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-android-apk.sh

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run @spark_1 (attempt 1)
        continue-on-error: true
        id: test1
        uses: reactivecircus/android-emulator-runner@v2
        with:
          profile: pixel_6
          api-level: 33
          arch: x86_64
          avd-name: Pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front none
          script: cd bitkit-e2e-tests && ./scripts/run-spark-e2e.sh android
        env:
          RECORD_VIDEO: true
          ATTEMPT: 1

      - name: Run @spark_1 (attempt 2)
        continue-on-error: true
        id: test2
        if: steps.test1.outcome != 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          profile: pixel_6
          api-level: 33
          arch: x86_64
          avd-name: Pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front none
          script: cd bitkit-e2e-tests && ./scripts/run-spark-e2e.sh android
        env:
          RECORD_VIDEO: true
          ATTEMPT: 2

      - name: Run @spark_1 (attempt 3)
        id: test3
        if: steps.test1.outcome != 'success' && steps.test2.outcome != 'success'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          profile: pixel_6
          api-level: 33
          arch: x86_64
          avd-name: Pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-front none
          script: cd bitkit-e2e-tests && ./scripts/run-spark-e2e.sh android
        env:
          RECORD_VIDEO: true
          ATTEMPT: 3

      - name: Collect Spark logs
        if: failure()
        working-directory: bitkit-e2e-tests
        run: |
          mkdir -p artifacts
          ./scripts/local-backend spark-logs --tail 200 > artifacts/spark-docker.log 2>&1 || true

      # Preserve logs and recordings from failed attempts even when a retry passes.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spark-android-${{ github.run_number }}
          path: bitkit-e2e-tests/artifacts/
          retention-days: 7

  slack-report:
    if: >-
      always() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.post_to_slack == true))
    needs: e2e-spark
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout shared Slack reporter
        uses: actions/checkout@v7
        with:
          repository: synonymdev/bitkit-e2e-tests
          ref: main
          persist-credentials: false

      - name: Post Slack summary
        run: python3 scripts/slack_summary.py e2e-local-nightly
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL_STAGING }}
          PLATFORM: android
          LOCAL_NIGHTLY_RESULT: ${{ needs.e2e-spark.result }}
          BUILD_RESULT: ${{ needs.e2e-spark.outputs.app-build }}
          E2E_TESTS_REF: ${{ needs.e2e-spark.outputs.e2e-sha || inputs.e2e_branch || 'main' }}
          SPARK_FIXTURE_RESULT: ${{ needs.e2e-spark.outputs.spark-fixture }}
          E2E_TESTS_RESULT: ${{ needs.e2e-spark.result }}
          SPARK_CASE_RESULT: ${{ needs.e2e-spark.outputs.spark-case }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
